<script>
'use strict';
// One domain model: scopes, installed assets, immutable task targets, retained history.
const $=s=>document.querySelector(s), terminal=$('#terminal'), screen=$('#screen'), editor=$('#editor');
const catalog={
 python:{name:'Python',source:'CPython · Astral 构建',versions:[['3.12.2','3.12'],['3.11.10','3.11']]},
 node:{name:'Node.js',source:'Node.js 官方',versions:[['22.11.0','22'],['20.18.0','20']]},
 java:{name:'Java',source:'Eclipse Temurin · HotSpot JDK',versions:[['21.0.5+11','21'],['21.0.4+7','21','演示目录未提供此 linux/x64 构建'],['17.0.13+11','17'],['11.0.25+9','11'],['8.0.432+6','8']]},
 go:{name:'Go',source:'go.dev',versions:[['1.23.2','1.23'],['1.22.9','1.22']]},

};
const order=Object.keys(catalog), scopeName={project:'当前项目',user:'用户默认'};
let db,ui,task=null,history=[],sequence=0,epoch=0,cols=120,rows=32,actions=[],regions=[],menuItems=[],viewRows=[],notice='Java 期望 21，当前 17；Enter 查看完整差异。';
const mq=matchMedia('(prefers-color-scheme: dark)');let theme='system';try{theme=localStorage.getItem('myenv.final.theme')||'system'}catch{}if(!['system','light','dark'].includes(theme))theme='system';
function applyTheme(){document.documentElement.dataset.theme=theme==='system'?(mq.matches?'dark':'light'):theme}
applyTheme();mq.addEventListener('change',applyTheme);
function chooseTheme(v){theme=v;try{localStorage.setItem('myenv.final.theme',v)}catch{}applyTheme();say('主题偏好已设为 '+{system:'系统（跟随终端）',light:'浅色',dark:'暗色'}[v]);render()}
function env(want,active){return {want,active,error:null}}
const DEMO_PATH='/home/dev/projects/demo-api';
const assetKey=(tool,version)=>tool+'@'+version;
const projectInfo=()=>db.projects[db.projectPath];
const scopeEnvs=(scope,path=db.projectPath)=>scope==='project'?db.projects[path]?.envs:db.scopes.user;
const scopeLabel=(scope,path=db.projectPath)=>scope==='project'?(db.projects[path]?.name||path):'用户默认';
function emptyEnvs(){return Object.fromEntries(order.map(t=>[t,env('',null)]))}
function projectBusy(){return running()||!!(ui.run&&!ui.run.done)}
function normalizeProjectPath(raw){const path=String(raw).trim();if(!path.startsWith('/')||/[\x00-\x1f\x7f]/.test(path))return null;const parts=[];for(const part of path.split('/')){if(!part||part==='.')continue;if(part==='..'){parts.pop();continue}parts.push(part)}return '/'+parts.join('/')}
function switchProject(raw){const path=normalizeProjectPath(raw);if(!path){say('请输入 Linux 绝对路径，如 /home/dev/projects/my-app。');render();return false}if(projectBusy()){say('同步或命令仍在运行；结束后才能更换项目目录。');render();return false}if(!db.projects[path])db.projects[path]={path,name:path.split('/').pop()||'根目录',envs:emptyEnvs(),demo:false};db.projectPath=path;db.scopes.project=db.projects[path].envs;db.recent=[path,...db.recent.filter(p=>p!==path)].slice(0,8);ui.run=null;ui.scope='project';ui.selected.project='java';ui.filters.project='';ui.stack=[];ui.context=null;ui.view='home';ui.zone='list';ui.action=0;ui.editing=null;editor.style.display='none';say(projectInfo().demo?'已返回 '+projectInfo().name+'；项目状态保留。':'已选择 '+projectInfo().name+'；未读取磁盘配置，可选择版本演示准备。');render();return true}
function openProjects(){if(projectBusy()){say('同步或命令仍在运行；结束后才能更换项目目录。');render();return}open('projects')}
function projectsView(){regions=['body','actions'];rule(3,'项目目录');put(1,2,'当前 '+db.projectPath,'muted',cols-4);put(2,2,'仅登记演示路径；不会读取配置、创建目录或更改真实环境。','muted',cols-4);viewRows=db.recent;ui.index=Math.min(ui.index,Math.max(0,viewRows.length-1));put(5,3,'最近项目 / Enter 切换','accent',cols-6);viewRows.forEach((path,i)=>put(7+i,3,(ui.index===i?'> ':'  ')+(path===db.projectPath?'[当前] ':'       ')+path,focusStyle('body',ui.index===i),cols-6,()=>{ui.index=i;switchProject(path)}));menuItems=[{label:'输入绝对路径',fn:()=>startEdit('projectPath',db.projectPath)},{label:'取消',fn:back}];menuItems.forEach((b,i)=>{const w=Math.floor((cols-6)/2);put(rows-6,3+i*w,'[ '+b.label+' ]',focusStyle('actions',ui.action===i),w-1,b.fn)});put(rows-5,3,'新目录从未配置状态开始；已访问项目在当前会话内保留。','muted',cols-6);footer('↑↓ 最近项目  Enter 切换  Tab 输入路径  Esc 取消')}

function assetPath(tool,version){return '~/.local/share/myenv/store/'+tool+'/'+version}
function install(tool,version,size=180){const key=assetKey(tool,version);if(!db.assets[key])db.assets[key]={key,tool,version,size,path:assetPath(tool,version),rollback:false,busy:false};return db.assets[key]}
function reset(){epoch++;sequence++;task=null;history=[];db={scopes:{project:{python:env('3.12','3.12.2'),node:env('22','22.11.0'),java:env('21','17.0.13+11'),go:env('1.23','1.23.2'),rust:env('1.82.0',null)},user:{python:env('3.11','3.11.10'),node:env('20','20.18.0'),java:env('17','17.0.13+11'),go:env('1.22','1.22.9'),rust:env('1.81.0','1.81.0')}},assets:{}};
db.projectPath=DEMO_PATH;db.projects={[DEMO_PATH]:{path:DEMO_PATH,name:'demo-api',envs:db.scopes.project,demo:true}};db.recent=[DEMO_PATH];
for(const s of Object.values(db.scopes))for(const [tool,e]of Object.entries(s))if(e.active)install(tool,e.active);
install('java','8.0.432+6',104);install('java','11.0.25+9',166).rollback=true;install('node','18.20.5',92).busy=true;install('go','1.22.9',128);
ui={scope:'project',selected:{project:'java',user:'java'},filters:{project:'',user:''},zone:'list',action:0,view:'home',stack:[],index:0,query:'',scroll:0,checked:new Set(),editing:null,run:null};editor.style.display='none';notice='Java 期望 21，当前 17；Enter 查看完整差异。';render()}
function current(){return db.scopes[ui.scope][ui.selected[ui.scope]]}
function toolId(){return ui.selected[ui.scope]}
function matches(want,exact){return !!exact&&(exact===want||exact.startsWith(want+'.')||exact.startsWith(want+'+'))}
function state(e){return !e.want?'未配置':e.error?'同步失败':!e.active?'待安装':matches(e.want,e.active)?'就绪':'待同步'}
function targetVersion(tool,want){return catalog[tool].versions.find(v=>!v[2]&&matches(want,v[0]))?.[0]}
function pathOf(tool,e){return e.active?db.assets[assetKey(tool,e.active)]?.path||assetPath(tool,e.active):'未安装；暂无生效路径'}
function protections(a){let r=[];if(db.scopes.user[a.tool]?.active===a.version)r.push('用户默认使用');for(const p of Object.values(db.projects))if(p.envs[a.tool]?.active===a.version)r.push(p.name+' 使用');if(a.rollback)r.push('回滚保留');if(a.busy)r.push('运行中占用');if(task&&['running','cancel-requested','finishing'].includes(task.status)&&task.tool===a.tool&&[task.before,task.target].includes(a.version))r.push('任务占用');return r}
function running(){return task&&['running','cancel-requested','finishing'].includes(task.status)}
function say(s){notice=s;$('#announce').textContent=s}
// Cell widths: grapheme segmentation; combining marks zero, CJK/fullwidth two.
// Ambiguous-width symbols are one cell in this prototype. A native TUI should use its terminal wcwidth policy.
const segmenter=typeof Intl.Segmenter==='function'?new Intl.Segmenter('zh',{granularity:'grapheme'}):null;
function graphemes(s){return segmenter?Array.from(segmenter.segment(String(s)),x=>x.segment):Array.from(String(s))}
function cellWidth(g){const n=g.codePointAt(0);if(/^\p{Mark}+$/u.test(g)||n===0x200d||n<32)return 0;if(/\p{Extended_Pictographic}/u.test(g))return 2;return n>=0x1100&&(n<=0x115f||n===0x2329||n===0x232a||(n>=0x2e80&&n<=0xa4cf)||(n>=0xac00&&n<=0xd7a3)||(n>=0xf900&&n<=0xfaff)||(n>=0xfe10&&n<=0xfe19)||(n>=0xfe30&&n<=0xfe6f)||(n>=0xff00&&n<=0xff60)||(n>=0xffe0&&n<=0xffe6)||n>=0x20000)?2:1}
function width(s){return graphemes(s).reduce((a,g)=>a+cellWidth(g),0)}
function cut(s,w){if(width(s)<=w)return String(s);let out='',n=0;for(const g of graphemes(s)){let k=cellWidth(g);if(n+k>w-1)break;out+=g;n+=k}return out+'…'}
function pad(s,w){s=cut(s,w);return s+' '.repeat(Math.max(0,w-width(s)))}
function wrap(s,w){let lines=[],line='',n=0;for(const g of graphemes(s)){if(g==='\n'){lines.push(line);line='';n=0;continue}const k=cellWidth(g);if(n+k>w){lines.push(line);line='';n=0}line+=g;n+=k}lines.push(line);return lines}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lines=[];
function put(y,x,s,cls='',w=cols-x-1,fn){if(y<0||y>=rows)return;const full=String(s),text=cut(full,w);let id='';if(fn){actions.push(fn);id=' data-action="'+(actions.length-1)+'"';cls+=' click'}lines[y].push('<span class="seg '+cls+'" style="left:'+x+'ch;width:'+w+'ch"'+id+' title="'+esc(full)+'">'+graphemes(text).map(g=>'<span class="glyph" style="width:'+cellWidth(g)+'ch">'+esc(g)+'</span>').join('')+'</span>')}
function rule(y,label=''){lines[y]=[];const text=label?' '+cut(label,cols-6)+' ':'';put(y,0,'├─'+text+'─'.repeat(Math.max(0,cols-3-width(text)))+'┤',label?'accent':'line',cols)}
function base(title){lines=Array.from({length:rows},()=>[]);actions=[];regions=[];menuItems=[];viewRows=[];
const heading=' myEnv / '+title+' ',status=' '+cols+'×'+rows+' · '+({system:'系统',light:'浅色',dark:'暗色'}[theme])+' ';put(0,0,'┌─'+heading+'─'.repeat(Math.max(0,cols-4-width(heading)-width(status)))+status+'─┐','strong',cols);
for(let y=1;y<rows-1;y++){put(y,0,'│','line',1);put(y,cols-1,'│','line',1)}put(rows-1,0,'└'+'─'.repeat(cols-2)+'┘','line',cols);rule(rows-4);put(rows-3,2,notice,'muted',cols-27);put(rows-2,2,'↑↓ 移动  Tab 切区  Enter 执行  Esc 返回  ? 帮助','',cols-4)}
function footer(s){lines[rows-2]=lines[rows-2].slice(0,2);put(rows-2,2,s,'',cols-4)}
function focusStyle(zone,selected=true){return selected?(ui.zone===zone?'focused':'selected'):''}
function snapshot(){return {view:ui.view,zone:ui.zone,index:ui.index,query:ui.query,scroll:ui.scroll,action:ui.action,context:ui.context,checked:new Set(ui.checked),editing:ui.editing?{...ui.editing}:null,inputValue:editor.value,inputStart:editor.selectionStart,inputEnd:editor.selectionEnd}}
function open(view,context){const saved=snapshot();if(ui.editing)endEdit();ui.stack.push(saved);ui.view=view;ui.zone='body';ui.index=0;ui.query='';ui.scroll=0;ui.action=0;ui.context=context;render()}
function back(){if(ui.editing){endEdit();render();return}if(ui.view==='run'){if(ui.run.done)restoreRun();else say('命令仍在模拟运行；Enter 请求中止。');render();return}let s=ui.stack.pop();if(s){Object.assign(ui,s);if(s.editing)editor.value=s.inputValue}else {ui.view='home';ui.zone='list'}render();if(s?.editing){editor.focus();editor.setSelectionRange(s.inputStart,s.inputEnd)}}
function filteredTools(){const q=ui.filters[ui.scope].toLowerCase();return order.filter(t=>db.scopes[ui.scope][t]&&(catalog[t].name+' '+db.scopes[ui.scope][t].want+' '+state(db.scopes[ui.scope][t])).toLowerCase().includes(q))}
function setScope(s){ui.scope=s;ui.action=0;say(scopeName[s]+' · 期望与生效独立保存');render()}
function homeActions(){return [{label:'同步预览',fn:()=>preview(ui.scope,toolId())},{label:'选择版本 / 修改期望',fn:()=>open('versions',{scope:ui.scope,tool:toolId()})},{label:'诊断环境',fn:()=>open('diagnose')},{label:'清理仓库',fn:()=>{ui.checked.clear();open('clean')}},{label:'运行版本命令',fn:runCommand},{label:'任务与错误记录',fn:()=>open('history')},{label:'软件来源',fn:()=>open('sources',{tool:toolId()})},{label:'项目目录',fn:openProjects},{label:'菜单 / 帮助',fn:()=>open('menu')} ]}
function home(){const wide=cols===120,split=wide?68:cols-1;regions=['scope','list','actions'];
put(1,2,'作用域',ui.zone==='scope'?'accent':'muted',8);put(1,11,(ui.scope==='project'?'[当前项目]':' 当前项目 '),focusStyle('scope',ui.scope==='project'),12,()=>{ui.zone='scope';setScope('project')});put(1,26,(ui.scope==='user'?'[用户默认]':' 用户默认 '),focusStyle('scope',ui.scope==='user'),12,()=>{ui.zone='scope';setScope('user')});put(1,wide?91:58,'[菜单]',ui.zone==='actions'&&ui.action===8?'focused':'accent',18,()=>open('menu'));
put(2,2,ui.scope==='project'?projectInfo().name+' / '+db.projectPath+' · linux/x64':'用户默认 / ~/.config/myenv/profile.yaml · linux/x64','muted',ui.scope==='project'?cols-20:cols-4);if(ui.scope==='project')put(2,cols-16,'[更换目录]','accent',14,openProjects);rule(3,'环境 / 期望与生效');
put(4,2,'  '+pad('工具',11)+pad('期望',13)+pad('当前生效',17)+'状态','muted',split-4);let list=filteredTools();if(!list.includes(toolId())&&list.length)ui.selected[ui.scope]=list[0];
list.forEach((t,i)=>{const e=db.scopes[ui.scope][t],sel=t===toolId();put(6+i,2,(sel?'> ':'  ')+pad(catalog[t].name,11)+pad(e.want||'未设置',13)+pad(e.active||'未安装',17)+state(e),focusStyle('list',sel),split-4,()=>{ui.selected[ui.scope]=t;ui.zone='list';ui.action=0;render()})});if(!list.length)put(7,3,'无匹配环境；/ 修改搜索，Esc 清除。','warn',split-6);
put(12,2,'/ 筛选: '+(ui.filters[ui.scope]||'全部环境'),'muted',split-4,()=>startEdit('homeSearch',ui.filters[ui.scope]));
const e=current(),t=toolId(),acts=homeActions();menuItems=acts;
if(wide){for(let y=4;y<rows-4;y++)put(y,68,'│','line',1);put(4,71,catalog[t].name+' / 详情与操作','accent',46);put(6,71,'期望 '+(e.want||'未设置')+'  →  生效 '+(e.active||'未安装'),state(e)==='就绪'?'accent':'warn',46);put(7,71,'状态 '+state(e)+(state(e)!=='就绪'?' · 期望尚未生效':''),'',46);put(9,71,'来源 '+catalog[t].source,'muted',46);put(10,71,'路径 '+pathOf(t,e),'muted',46);put(11,71,'[完整详情]  Enter（列表区域）','accent',46,()=>open('detail',{scope:ui.scope,tool:t}));put(13,71,'操作   Tab 到此后 ↑↓ / Enter','muted',46);acts.forEach((a,i)=>put(15+i,71,(ui.action===i?'> ':'  ')+a.label,focusStyle('actions',ui.action===i),46,()=>{ui.zone='actions';ui.action=i;a.fn()}));
const entries=Object.entries(db.scopes[ui.scope]),pending=entries.filter(([,value])=>state(value)!=='就绪');
put(15,3,'当前作用域','strong',63);
put(17,3,'就绪 '+(entries.length-pending.length)+' / '+entries.length+'   待处理 '+pending.length,'accent',63);
put(18,3,pending.length?pending.map(([id,value])=>catalog[id].name+' '+state(value)).join('  ·  '):'所有工具的生效版本均满足期望。','muted',63);
put(21,3,'最近活动','strong',63);
const recent=history.filter(record=>record.scope===ui.scope&&(record.scope!=='project'||record.projectPath===db.projectPath)).slice(0,2);
if(recent.length)recent.forEach((record,i)=>put(23+i,3,'#'+record.id+' '+catalog[record.tool].name+' '+record.target+' · '+record.stage,record.status==='failed'?'error':'muted',63,()=>open('task',{record})));
else put(23,3,'暂无记录；选择工具后查看同步预览。','muted',63);
put(26,3,'Enter 查看详情 · / 筛选 · ? 上下文帮助','muted',63);

 home:{name:'环境工作台',lines:['列表：↑↓ 选择工具；Enter 查看完整详情；/ 筛选。','Tab 在作用域、环境列表与操作区之间移动。','作用域：←→ 切换；操作区：↑↓ 选择，Enter 执行。']},
 versions:{name:'版本目录',lines:['↑↓ 选择版本；Enter 保存精确期望并打开预览。','/ 搜索系列或版本；Tab 可手动填写期望。','不可用版本会说明原因，不会被安装。']},
 task:{name:'同步任务',lines:['Tab 到操作区可请求取消、查看记录或返回浏览。','取消需等待正在收尾；完成之前不会显示已取消。','Esc 返回浏览；任务保持运行，目标作用域保持不变。']},
 clean:{name:'清理预览',lines:['↑↓ 选择安装项；Space / Enter 标记可清理项。','受保护项会显示原因，无法标记。','Tab 到确认操作；移除前再次核对引用与占用。']},
 diagnose:{name:'环境诊断',lines:['↑↓ 选择检查项；Enter 查看说明与处理入口。','诊断根据当前作用域的生效版本与期望生成。']},
 theme:{name:'主题',lines:['↑↓ 选择系统、浅色或暗色；Enter 应用。','系统主题自动跟随；手动主题保持固定。']},
 history:{name:'任务记录',lines:['↑↓ 选择任务；Enter 查看阶段、完整日志和错误。','最多保留本次会话最近 24 条模拟任务；记录绑定原项目。']}};
const context=contexts[from]||{name:'详情与操作',lines:['↑↓ 滚动完整内容；Tab 到操作区，Enter 执行。']};
textView('帮助 / '+context.name,[...context.lines,'','通用：Esc 返回；? 打开帮助；Shift+Tab 反向切区。','选中行保留 > 标记；有焦点的选择使用反色。','输入时文字键不会触发操作；Enter 提交，Esc 结束输入。','Ctrl/Cmd+C 保留浏览器复制；F6 移到外部演示控制。','命令结束后按 Enter 返回原工作区，恢复选择与焦点。','版本、诊断、任务与文件操作均为内存演示。'],[{label:'返回',fn:back}])}
function historyView(){regions=['body'];rule(3,'任务与错误记录 / 保留失败信息');viewRows=history;ui.index=Math.min(ui.index,Math.max(0,history.length-1));let cap=rows-9,start=Math.max(0,ui.index-cap+1);history.slice(start,start+cap).forEach((t,i)=>put(5+i,3,(ui.index===start+i?'> ':'  ')+'#'+t.id+' '+pad(scopeLabel(t.scope,t.projectPath),14)+pad(catalog[t.tool].name,10)+pad(t.target,17)+t.stage,focusStyle('body',ui.index===start+i),cols-6,()=>{ui.index=start+i;open('task',{record:t})}));if(!history.length)put(6,3,'暂无任务；请从工具操作区进入同步预览。','muted',cols-6);footer('↑↓ 记录  Enter 查看任务与错误  Esc 返回  ? 帮助')}
function runCommand(){if(running()){say('同步正在进行；环境稳定后才能运行版本命令。');render();return}const t=toolId(),e=current();if(!e.active){say(catalog[t].name+' 未安装；请先进入同步预览。');render();return}ui.run={saved:snapshot(),scope:ui.scope,projectPath:ui.scope==='project'?db.projectPath:null,tool:t,version:e.active,path:pathOf(t,e),done:false,stopped:false,lines:[],epoch};ui.view='run';const r=ui.run;const cmd={java:'java -version',python:'python --version',node:'node --version',go:'go version',rust:'rustc --version'}[t];r.lines=['$ '+cmd,'[模拟] 已离开 TUI 工作区；执行版本查询。'];render();setTimeout(()=>{if(ui.run!==r||epoch!==r.epoch||r.done)return;r.lines.push(({python:'Python '+r.version,node:'v'+r.version,java:'openjdk version "'+r.version.split('+')[0]+'" / Eclipse Temurin '+r.version,go:'go version go'+r.version+' linux/amd64',rust:'rustc '+r.version})[t], '环境路径：'+r.path);render()},700);setTimeout(()=>{if(ui.run!==r||epoch!==r.epoch||r.done)return;r.done=true;r.lines.push('[模拟] 命令结束，退出码 0。');render()},1600)}
function runView(){lines=Array.from({length:rows},()=>[]);actions=[];regions=[];menuItems=[];put(1,2,'普通终端输出 / 演示','strong',cols-4);put(2,2,'TUI 工作区已暂离；未执行真实命令。','muted',cols-4);let y=4;ui.run.lines.flatMap(s=>wrap(s,cols-4)).forEach(s=>put(y++,2,s,'',cols-4));put(rows-3,2,ui.run.done?'[进程已结束] Enter 返回原工作区':'[运行中] Enter 请求中止','accent',cols-4,()=>runEnter());put(rows-2,2,'原选择与操作焦点已保存。','muted',cols-4)}
function runEnter(){if(ui.run.done){restoreRun();return}ui.run.done=true;ui.run.stopped=true;ui.run.lines.push('已中止模拟进程，退出码 130。');render()}
function restoreRun(){const saved=ui.run.saved;ui.run=null;Object.assign(ui,saved);render();terminal.focus({preventScroll:true})}
function startEdit(kind,value){ui.editing={kind,prior:value};editor.value=value;editor.setAttribute('aria-label',kind==='want'?'输入期望系列或精确版本':kind==='projectPath'?'输入 Linux 项目绝对路径':'搜索');render();editor.focus();editor.setSelectionRange(value.length,value.length)}
function endEdit(){ui.editing=null;editor.style.display='none';terminal.focus({preventScroll:true})}
function render(){base(ui.view==='home'?'环境工作台':({versions:'版本目录',preview:'同步计划',task:'任务观察',run:'命令输出'}[ui.view]||'工作区'));({home,detail:details,versions,preview:previewView,task:taskView,diagnose:diagnosis,issue,clean:cleanView,cleanConfirm:cleanConfirmView,menu:menuView,projects:projectsView,sources:sourcesView,theme:themeView,help:helpView,history:historyView,info:()=>textView(ui.context.title,ui.context.text),run:runView}[ui.view]||home)();if(ui.view!=='run')put(rows-3,cols-22,' 焦点 / '+(ui.editing?'输入':({scope:'作用域',list:'环境',actions:'操作',body:'内容'}[ui.zone]||ui.zone))+' ','accent',20);
screen.innerHTML=lines.map((l,y)=>'<div class="row" style="top:'+(y*22)+'px">'+l.join('')+'</div>').join('');terminal.style.setProperty('--cols',cols);terminal.style.setProperty('--rows',rows);if(ui.editing){editor.style.display='block';editor.style.left='13ch';editor.style.width=(cols-17)+'ch';editor.style.top=(ui.editing.kind==='homeSearch'?12:ui.editing.kind==='versionSearch'?4:rows-8)*22+'px';footerInput()}else editor.style.display='none'}
function footerInput(){const row=screen.children[rows-2];row.innerHTML='<span class="seg" style="left:2ch">输入中 · Enter 提交  Esc 结束输入 · 文字键不会触发操作</span>'}
screen.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el){const fn=actions[+el.dataset.action];terminal.focus({preventScroll:true});fn?.()}else terminal.focus({preventScroll:true})});
editor.addEventListener('input',()=>{const k=ui.editing?.kind;if(k==='homeSearch'){ui.filters[ui.scope]=editor.value;render()}if(k==='versionSearch'){ui.query=editor.value;ui.index=0;render()}});
editor.addEventListener('keydown',e=>{e.stopPropagation();if(e.isComposing||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='F6'){e.preventDefault();$('#viewport').focus();return;}if(e.key==='Escape'){e.preventDefault();if(ui.editing.kind==='want'||ui.editing.kind==='projectPath')say('已放弃未提交的输入。');endEdit();render()}else if(e.key==='Enter'){e.preventDefault();if(ui.editing.kind==='projectPath'){switchProject(editor.value)}else if(ui.editing.kind==='want'){if(saveWant(editor.value)){endEdit();preview(ui.context.scope,ui.context.tool)}}else{endEdit();ui.zone=ui.view==='home'?'list':'body';render()}}else if(e.key==='Tab'){e.preventDefault();if(ui.editing.kind==='want'||ui.editing.kind==='projectPath'){say('输入尚未提交；Enter 保存或 Esc 放弃。');render()}else{endEdit();ui.zone=e.shiftKey?'body':'actions';if(ui.view==='home')ui.zone=e.shiftKey?'scope':'list';render()}}});
terminal.addEventListener('keydown',e=>{if(e.target===editor||e.isComposing||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='F6'){e.preventDefault();$('#viewport').focus();return}const keys=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab','Enter','Escape','/','?',' '];if(!keys.includes(e.key))return;e.preventDefault();if(ui.view==='run'){if(e.key==='Enter')runEnter();else if(e.key==='Escape')back();return}if(e.key==='?'){open('help',{from:ui.view});return}if(e.key==='Escape'){if(ui.view==='home'){if(ui.filters[ui.scope]){ui.filters[ui.scope]='';say('搜索已清除。')}else ui.zone='list';render()}else back();return}if(e.key==='/'){if(ui.view==='home')startEdit('homeSearch',ui.filters[ui.scope]);else if(ui.view==='versions')startEdit('versionSearch',ui.query);else{say('此页无需搜索；↑↓ 浏览或 Esc 返回。');render()}return}
if(e.key==='Tab'){const n=regions.indexOf(ui.zone);ui.zone=regions[(n+(e.shiftKey?-1:1)+regions.length)%regions.length]||'body';render();return}
const delta=['ArrowDown','ArrowRight'].includes(e.key)?1:['ArrowUp','ArrowLeft'].includes(e.key)?-1:0;
if(ui.view==='home'){if(ui.zone==='scope'){if(delta||e.key==='Enter')setScope(ui.scope==='project'?'user':'project');return}if(ui.zone==='list'){if(delta){const list=filteredTools(),i=list.indexOf(toolId());if(list.length)ui.selected[ui.scope]=list[(i+delta+list.length)%list.length];ui.action=0}if(e.key==='Enter'&&filteredTools().length)open('detail',{scope:ui.scope,tool:toolId()})}else if(ui.zone==='actions'){if(delta)ui.action=(ui.action+delta+menuItems.length)%menuItems.length;if(e.key==='Enter')menuItems[ui.action].fn()}}
else if(ui.zone==='actions'){if(delta&&menuItems.length)ui.action=(ui.action+delta+menuItems.length)%menuItems.length;if(e.key==='Enter')menuItems[ui.action]?.fn()}
else if(['versions','diagnose','clean','history','menu','theme','projects'].includes(ui.view)){const items=['menu','theme'].includes(ui.view)?menuItems:viewRows;if(delta&&items.length)ui.index=(ui.index+delta+items.length)%items.length;if(e.key==='Enter'||(e.key===' '&&ui.view==='clean')){if(ui.view==='projects'){const path=viewRows[ui.index];if(path)switchProject(path)}else if(ui.view==='versions')selectVersion();else if(ui.view==='diagnose')diagnoseOpen();else if(ui.view==='clean')toggleClean();else if(ui.view==='history'&&viewRows[ui.index])open('task',{record:viewRows[ui.index]});else menuItems[ui.index]?.fn()}}else if(delta)ui.scroll=Math.max(0,ui.scroll+delta);render()});
$('#viewport').addEventListener('change',e=>{cols=+e.target.value;rows=cols===120?32:24;render()});$('#reset').addEventListener('click',()=>{reset();terminal.focus()});$('#scenario').addEventListener('change',()=>{say('下次同步场景已设定；已启动任务不受影响。');render()});
// Reference notes (offline document, no requests):
// https://learn.microsoft.com/en-us/windows/terminal/customize-settings/color-schemes
// https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/At-rules/@media/prefers-color-scheme
// https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html
window.addEventListener('storage',event=>{if(event.key==='myenv.final.theme'){theme=['system','light','dark'].includes(event.newValue)?event.newValue:'system';applyTheme();render()}});
reset();terminal.focus({preventScroll:true});
</script>
